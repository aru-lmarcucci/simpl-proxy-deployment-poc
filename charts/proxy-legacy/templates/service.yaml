apiVersion: v1
kind: Service
metadata:
  name: proxy-headless
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
